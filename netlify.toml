[build]
  command = "npm run build"
  publish = "out"

# Turns on the Netlify Image CDN loader in next.config.ts. Safe to commit —
# it's a switch, not a secret, and it must live here rather than in Site
# settings precisely because it has to be false everywhere that ISN'T
# Netlify. A static export has no image optimizer of its own, so without
# this the portfolio ships a 422 KB 2400px JPEG to a phone (LCP 6.0s,
# Lighthouse Performance 66). With it, the same photo is 49 KB of WebP.
[build.environment]
  NEXT_PUBLIC_NETLIFY_IMAGES = "1"

# GH_PAGES_BASE_PATH is intentionally NOT set here — Netlify serves this
# site at its own domain root, so basePath must stay empty (the default in
# next.config.ts). Only a GitHub Pages deploy needs that variable.
#
# NEXT_PUBLIC_SITE_URL should be set in Site settings > Environment
# variables, not here, so the value isn't committed. Until it is, the site
# falls back to https://ryanshutter.com (see src/lib/site.ts) — which is
# the intended production domain, so canonicals and the sitemap are correct
# either way.

# Forms: Netlify's build bot detects the data-netlify="true" form in the
# built HTML automatically. No API key, no env var. Submissions only reach an
# inbox once an email notification is added under Site configuration >
# Notifications > Emails and webhooks > Form submission notifications.

# No SPA fallback redirect needed — every route (including shoot detail
# pages) is pre-rendered to a real HTML file via generateStaticParams, and
# Netlify serves out/404.html automatically for genuinely missing paths.

# ---------------------------------------------------------------------------
# ADMIN PORTAL — /admin/, username + password, runs entirely on Netlify.
#
#   public/admin/                      the page (static HTML/CSS/JS)
#   netlify/functions/admin-api.mjs    /api/admin/*  sign-in, upload, save,
#                                      hide/unhide, delete, account
#   netlify/functions/media.mjs        /media/*      uploaded photos, until
#                                      the next build makes them static
#   netlify/plugins/content-from-blobs rewrites content/shoots/ and
#                                      public/media/ from Netlify Blobs
#                                      before every build
#
# Profiles and photos live in Netlify Blobs, which belong to this Netlify
# site and move with it on a transfer. No GitHub account is involved.
#
# Environment variables (Site configuration > Environment variables):
#   BUILD_HOOK_URL       A build hook for this site (Site configuration >
#                        Build & deploy > Build hooks). Required for "save and
#                        it goes live". Without it saves still land, and go
#                        live on the next deploy; the portal says so.
#   ADMIN_PASSWORD_HASH  Optional recovery override — see
#   ADMIN_USERNAME       scripts/admin-password.mjs.
# ---------------------------------------------------------------------------
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[plugins]]
  package = "/netlify/plugins/content-from-blobs"

[[headers]]
  for = "/images/*"
  [headers.values]
    # Photographs are content-addressed by filename and never edited in
    # place — a changed photo gets a new file. Long cache is safe and is
    # most of the repeat-visit performance win on an image-heavy site.
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/media/*"
  [headers.values]
    # Uploaded photos get a random id that is never reused.
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-cache"
    X-Frame-Options = "DENY"
    Content-Security-Policy = "default-src 'self'; img-src 'self' blob: data:; style-src 'self'; script-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Browser tab icon: the same shutter aperture as components/logo.tsx.
       Colours are baked rather than tokenised — a favicon renders outside
       the page, so it cannot inherit anything. The dark disc keeps the
       gold blades legible on both light and dark browser chrome. -->
  <circle cx="16" cy="16" r="16" fill="#100D0A"/>
  <circle cx="16" cy="16" r="13.5" fill="none" stroke="#F3EDE3" stroke-width="1.5" opacity="0.55"/>
  <g fill="#D3A054">
    <path d="M16 4.6 L26.1 10.4 L22.7 12.4 Z"/>
    <path d="M16 4.6 L26.1 10.4 L22.7 12.4 Z" transform="rotate(60 16 16)"/>
    <path d="M16 4.6 L26.1 10.4 L22.7 12.4 Z" transform="rotate(120 16 16)"/>
    <path d="M16 4.6 L26.1 10.4 L22.7 12.4 Z" transform="rotate(180 16 16)"/>
    <path d="M16 4.6 L26.1 10.4 L22.7 12.4 Z" transform="rotate(240 16 16)"/>
    <path d="M16 4.6 L26.1 10.4 L22.7 12.4 Z" transform="rotate(300 16 16)"/>
  </g>
  <circle cx="16" cy="16" r="3.4" fill="#F3EDE3" opacity="0.9"/>
</svg>
